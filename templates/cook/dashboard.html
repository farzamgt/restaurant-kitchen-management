{% extends "base.html" %}

{% block title %}User Dashboard{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4 text-center">Welcome, {{ request.user.username }}!</h2>

    <div class="row justify-content-center">
        <!-- Placeholder for Dish CRUD -->
        <div class="col-md-4 mb-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Dishes</h5>
                    <p class="card-text">View and manage dishes</p>
                    <a href="{% url 'dish:dish_list' %}" class="btn btn-primary">Go</a>
                </div>
            </div>
        </div>

        <!-- Placeholder for DishType CRUD -->
        <div class="col-md-4 mb-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Dish Types</h5>
                    <p class="card-text">View and manage dish types</p>
                    <a href="{% url 'dish:dishtype_list' %}" class="btn btn-primary">Go</a>
                </div>
            </div>
        </div>

        <!-- Placeholder for Ingredient CRUD -->
        <div class="col-md-4 mb-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Ingredients</h5>
                    <p class="card-text">View and manage ingredients</p>
                    <a href="#" class="btn btn-primary">Go</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
