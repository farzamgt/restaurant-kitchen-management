{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Your Profile</h3>

                    <form method="post" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100 mt-3">Save Changes</button>
                        <a href="{% url 'cook:dashboard' %}" class="btn btn-secondary w-100 mt-2">Back to Dashboard</a>
                        <a href="{% url 'cook:logout' %}" class="btn btn-outline-secondary w-100 mt-2">Logout</a>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
