{% load static %}
<nav class="navbar navbar-light bg-light fixed-top">
  <div class="container-fluid justify-content-end">
    <a class="navbar-brand me-auto" href="{% url 'cook:dashboard' %}">RestoManage</a>
    <button class="btn btn-outline-secondary" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
      <i class="bi bi-list"></i>
    </button>
  </div>
</nav>

<div class="offcanvas offcanvas-end bg-light" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="sidebarMenuLabel">Menu</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body p-0">
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" href="{% url 'cook:dashboard' %}">
          <i class="bi bi-house-door me-2"></i> Main Page
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{% url 'cook:cook_list' %}">
          <i class="bi bi-person-badge me-2"></i> Kitchen Staff
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{% url 'dish:dish_list' %}">
          <i class="bi bi-card-list me-2"></i> Meals & Prices
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{% url 'dish:dishtype_list' %}">
          <i class="bi bi-grid-1x2 me-2"></i> Categories
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{% url 'ingredient:ingredient_list' %}">
          <i class="bi bi-basket3 me-2"></i> Ingredients
        </a>
      </li>
      <hr class="my-2">
      {% if request.user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'cook:profile' %}">
            <i class="bi bi-person-circle me-2"></i> Profile
          </a>
        </li>
        <li class="nav-item">
          <form action="{% url 'cook:logout' %}" method="post" class="m-0">
            {% csrf_token %}
            <button type="submit" class="nav-link btn btn-link text-start w-100">
              <i class="bi bi-box-arrow-right me-2"></i> Logout
            </button>
          </form>
        </li>
      {% else %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'cook:login' %}">
            <i class="bi bi-box-arrow-in-right me-2"></i> Login
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'cook:signup' %}">
            <i class="bi bi-person-plus me-2"></i> Sign Up
          </a>
        </li>
      {% endif %}
    </ul>
  </div>
</div>

<style>
  body {
    padding-top: 56px; /* height of navbar */
  }
</style>
