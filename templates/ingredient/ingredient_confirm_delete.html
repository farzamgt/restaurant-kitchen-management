{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Delete Ingredient</h2>

    <p>Are you sure you want to delete "{{ object.name }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'ingredient:ingredient_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock content %}
