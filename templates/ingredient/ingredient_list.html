{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <!-- Title + Add button -->
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h2>Ingredients</h2>
        <a href="{% url 'ingredient:ingredient_create' %}" class="btn btn-outline-primary btn-sm">Add New</a>
    </div>

    <!-- Search box -->
    <form method="get" class="d-flex mb-3" style="max-width: 300px;">
        <input type="text" name="q" class="form-control me-2" placeholder="Search ingredients..."
               value="{{ request.GET.q }}">
        <button type="submit" class="btn btn-outline-secondary btn-sm">Search</button>
    </form>

    <!-- Table -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for ingredient in object_list %}
                <tr>
                    <td>{{ ingredient.name }}</td>
                    <td>
                        <a href="{% url 'ingredient:ingredient_update' ingredient.pk %}" class="btn btn-outline-warning btn-sm">Edit</a>
                        <a href="{% url 'ingredient:ingredient_delete' ingredient.pk %}" class="btn btn-outline-danger btn-sm">Delete</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="2">No ingredients found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
