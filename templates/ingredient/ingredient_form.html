{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">{% if object %}Update{% else %}Create{% endif %} Ingredient</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-success">{% if object %}Update{% else %}Create{% endif %}</button>
        <a href="{% url 'ingredient:ingredient_list' %}" class="btn btn-secondary">Back</a>
    </form>
</div>
{% endblock content %}
