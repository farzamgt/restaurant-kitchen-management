{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Dishes</h2>

    <div class="d-flex justify-content-between mb-3">
        <a href="{% url 'dish:dish_create' %}" class="btn btn-primary">Add Dish</a>

        <form method="get" class="d-flex" style="width: 300px;">
            <input type="text" name="q" class="form-control me-2" placeholder="Search dishes..."
                   value="{{ request.GET.q }}">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
        </form>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Photo</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for dish in object_list %}
                <tr>
                    <td>
                        <a href="{% url 'dish:dish_detail' dish.pk %}">{{ dish.name }}</a>
                    </td>
                    <td>
                        {% if dish.photo %}
                            <img src="{{ dish.photo.url }}" alt="{{ dish.name }}"
                                 class="img-thumbnail" style="width:50px; height:50px; object-fit:cover;">
                        {% else %}
                            <div class="d-flex justify-content-center align-items-center bg-light border rounded"
                                 style="width:50px; height:50px;">
                                 <i class="fas fa-utensils"></i>
                            </div>
                        {% endif %}
                    </td>
                    <td>
                        <a href="{% url 'dish:dish_update' dish.pk %}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="{% url 'dish:dish_delete' dish.pk %}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">No dishes found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
