{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Dish Types</h2>

    <div class="d-flex justify-content-between mb-3">
        <a href="{% url 'dish:dishtype_create' %}" class="btn btn-primary">Add Dish Type</a>

        <form method="get" class="d-flex" style="width: 300px;">
            <input type="text" name="q" class="form-control me-2" placeholder="Search dish types..."
                   value="{{ request.GET.q }}">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
        </form>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for dishtype in object_list %}
                <tr>
                    <td>{{ dishtype.name }}</td>
                    <td>
                        <a href="{% url 'dish:dishtype_update' dishtype.pk %}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="{% url 'dish:dishtype_delete' dishtype.pk %}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="2">No dish types found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
