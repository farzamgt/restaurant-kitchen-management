{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <!-- Title + Add button -->
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h2>Categories</h2>
        <a href="{% url 'dish:dishtype_create' %}" class="btn btn-outline-primary btn-sm">Add New</a>
    </div>
    <!-- Search box -->
    <form method="get" class="d-flex mb-3" style="width: 300px;">
        <input type="text" name="q" class="form-control me-2" placeholder="Search dish types..."
               value="{{ request.GET.q }}">
        <button type="submit" class="btn btn-outline-secondary btn-sm">Search</button>
    </form>
    <!-- Table -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for dishtype in object_list %}
                <tr>
                    <td>{{ dishtype.name }}</td>
                    <td>
                        <a href="{% url 'dish:dishtype_update' dishtype.pk %}" class="btn btn-outline-warning btn-sm">Edit</a>
                        <a href="{% url 'dish:dishtype_delete' dishtype.pk %}" class="btn btn-outline-danger btn-sm">Delete</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="2">No dish types found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
