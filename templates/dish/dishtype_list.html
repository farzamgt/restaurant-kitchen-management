{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Dish Types</h2>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <a href="{% url 'dish:dishtype_create' %}" class="btn btn-primary mb-3">Add Dish Type</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for dishtype in object_list %}
                <tr>
                    <td>{{ dishtype.name }}</td>
                    <td>
                        <a href="{% url 'dish:dishtype_update' dishtype.pk %}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="{% url 'dish:dishtype_delete' dishtype.pk %}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="2">No dish types found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
