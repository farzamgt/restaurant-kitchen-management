{% extends "base.html" %}

{% block title %}Logged Out{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">You have been logged out</h3>
                <p>
                    <a href="{% url 'cook:login' %}" class="btn btn-primary">Sign In Again</a>
                    or
                    <a href="{% url 'cook:signup' %}" class="btn btn-secondary">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
